  <style>
    * {
      touch-action: manipulation;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #20242b, #0d0f12);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 10px;
      overflow-x: hidden;
    }

    /* Handheld body with classic 1981 dark wine-red / burgundy finish */
    .casing-chassis {
      background: linear-gradient(175deg, #87141f 0%, #680d15 45%, #46060b 100%);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.85), inset 0 2px 3px rgba(255, 255, 255, 0.25), inset 0 -3px 6px rgba(0, 0, 0, 0.6);
      border-radius: 36px;
      border: 3.5px solid #2e0307;
    }

    /* Champagne gold brushed aluminum faceplate with hairline borders */
    .champagne-plate {
      background: linear-gradient(135deg, #faefc5 0%, #ecd48b 35%, #d8ba66 70%, #ebd793 100%);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), inset 0 -2px 5px rgba(110, 80, 20, 0.4), 0 4px 10px rgba(0,0,0,0.3);
      border: 2px solid #a68128;
    }

    /* Recessed screen bezel with red frame */
    .bezel-frame {
      background: #73131c;
      box-shadow: inset 0 5px 12px rgba(0,0,0,0.85), 0 2px 4px rgba(255,255,255,0.4);
      border-radius: 14px;
      border: 2px solid #4a070c;
    }

    /* LCD Screen with authentic G&W color reproduction */
    .lcd-display {
      background-color: #c9d7c0;
      box-shadow: inset 3px 3px 12px rgba(0, 0, 0, 0.4), inset -2px -2px 8px rgba(255, 255, 255, 0.5);
      position: relative;
      overflow: hidden;
    }

    /* Subtle LCD segment ghosting and matrix texture */
    .lcd-display::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.02) 0px,
        rgba(0, 0, 0, 0.02) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 15;
    }

    /* Authentic vintage 7-Segment Digital Clock & Score */
    .lcd-digits {
      font-family: 'VT323', monospace;
      letter-spacing: 2px;
    }

    /* Burgundy/red circular rubber buttons */
    .game-button {
      background: radial-gradient(circle at 35% 30%, #e82c3c 0%, #a8101e 65%, #6a050f 100%);
      box-shadow: 0 6px 0 #3a0307, 0 10px 18px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.45);
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .game-button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #3a0307, 0 4px 8px rgba(0,0,0,0.5), inset 0 1px 2px rgba(0,0,0,0.6);
    }

    /* Small gold/bronze pill buttons for Game A, Game B, Time */
    .system-btn {
      background: radial-gradient(circle at 40% 30%, #ffffff 0%, #d8d8d8 50%, #9e9e9e 100%);
      box-shadow: 0 3px 0 #4f4f4f, 0 5px 8px rgba(0,0,0,0.4);
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .system-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #4f4f4f, 0 2px 4px rgba(0,0,0,0.4);
    }
  </style>

<body class="flex flex-col items-center justify-center">

  <!-- MAIN HANDHELD CONSOLE -->
  <div class="casing-chassis w-full max-w-[530px] p-3.5 sm:p-5 flex flex-col items-center relative">
    
    <!-- Top Decorative Header -->
    <div class="w-full flex items-center justify-between px-2 mb-1.5 text-[#ebd793] font-bold text-[11px] tracking-widest">
      <div class="flex items-center gap-1.5">
        <span class="border border-[#ebd793] px-1 py-0.2 rounded text-[9px]">Nintendo</span>
        <span class="tracking-wider">GAME &amp; WATCH</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="soundToggle" class="system-btn px-2.5 py-0.5 rounded-full text-[9px] font-bold text-neutral-800 tracking-normal border border-neutral-400">
          <span id="soundLabel">🔊 ON</span>
        </button>
        <button id="aclBtn" class="system-btn px-2 py-0.5 rounded-full text-[9px] font-bold text-neutral-800 tracking-normal border border-neutral-400">

        </button>
      </div>
    </div>

    <!-- Gold Faceplate -->
    <div class="champagne-plate w-full rounded-2xl p-2 sm:p-3.5 flex flex-col items-center relative">
      
      <!-- Top Sub-Bar: System Mode Buttons & Titles -->
      <div class="w-full flex justify-between items-center mb-1 px-1">
        <div class="text-[12px] font-black tracking-[0.2em] text-[#56070d]">
          OCTOPUS
        </div>

        <!-- Mode Select Buttons: Game A, Game B, Time -->
        <div class="flex items-center gap-1.5">
          <div class="flex flex-col items-center">
            <button id="btnGameA" class="system-btn w-6 h-4 sm:w-7 sm:h-4 rounded border border-neutral-400"></button>
            <span class="text-[8px] font-bold text-[#56070d] tracking-tighter">GAME A</span>
          </div>
          <div class="flex flex-col items-center">
            <button id="btnGameB" class="system-btn w-6 h-4 sm:w-7 sm:h-4 rounded border border-neutral-400"></button>
            <span class="text-[8px] font-bold text-[#56070d] tracking-tighter">GAME B</span>
          </div>
          <div class="flex flex-col items-center">
            <button id="btnTime" class="system-btn w-6 h-4 sm:w-7 sm:h-4 rounded border border-neutral-400"></button>

      <!-- Recessed Screen Bezel -->
      <div class="bezel-frame p-2 w-full rounded-xl">

          <!-- Game Over Alert Popup -->

    <!-- Handheld Controller Pad: Big Classic Tactile Rubber Buttons -->
    <div class="w-full mt-3 sm:mt-4 flex items-center justify-between px-3 sm:px-8">
      
      <!-- LEFT Button: Retreat / Climb to boat -->
      <div class="flex flex-col items-center">
        <button id="btnLeft" class="game-button w-20 h-20 sm:w-24 sm:h-24 rounded-full flex flex-col items-center justify-center text-amber-100 font-bold border-2 border-[#4b060b]">
          <svg class="w-9 h-9 fill-current" viewBox="0 0 24 24">
            <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
          </svg>
          <span class="text-xs tracking-wider">LEFT</span>
        </button>
        <span class="text-[9px] text-[#ebd793]/85 mt-1 font-bold tracking-wider">RETREAT</span>
      </div>

      <!-- Center Instruction Badge -->
      <div class="flex flex-col items-center text-center text-[#ebd793]/75 text-[10px] leading-tight">
        <div id="modeTag" class="text-xs font-bold text-[#ffd778] tracking-widest uppercase">GAME A</div>
        <div class="text-[9px] text-amber-200/60 mt-0.5">HIGH: <span id="hiScoreVal">0000</span></div>
      </div>

      <!-- RIGHT Button: Dive down / Scoop treasure -->
      <div class="flex flex-col items-center">
        <button id="btnRight" class="game-button w-20 h-20 sm:w-24 sm:h-24 rounded-full flex flex-col items-center justify-center text-amber-100 font-bold border-2 border-[#4b060b]">
          <svg class="w-9 h-9 fill-current" viewBox="0 0 24 24">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
          </svg>
          <span class="text-xs tracking-wider">RIGHT</span>
        </button>
        <span class="text-[9px] text-[#ebd793]/85 mt-1 font-bold tracking-wider">DIVE / TAKE</span>
      </div>

    </div>

    <!-- Desktop Keyboard Notice -->
    <div class="text-[9px] text-[#ebd793]/60 mt-2 text-center">
      [ Keyboard: <kbd class="px-1 bg-black/40 rounded border border-amber-200/20">◀</kbd> / <kbd class="px-1 bg-black/40 rounded border border-amber-200/20">A</kbd> = Left | <kbd class="px-1 bg-black/40 rounded border border-amber-200/20">▶</kbd> / <kbd class="px-1 bg-black/40 rounded border border-amber-200/20">D</kbd> / <kbd class="px-1 bg-black/40 rounded border border-amber-200/20">Space</kbd> = Right ]
    </div>

  </div>

  <!-- SCRIPT ENGINE -->
  <script>
    /* =====================================================================
       1. VINTAGE 1-BIT PIEZO BUZZER SOUND SYNTHESIZER (Web Audio API)
       ===================================================================== */
    class GWBeepEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      beep(freq, duration = 0.035, type = 'square') {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          // Audio safe guard
        }
      }

      step() { this.beep(1040, 0.03); }
      takeGold() { 
        this.beep(1480, 0.025); 
        setTimeout(() => this.beep(2093, 0.04), 30);
      }
      depositGold() {
        this.beep(784, 0.04);
        setTimeout(() => this.beep(1046, 0.05), 50);
        setTimeout(() => this.beep(1567, 0.08), 110);
      }
      tentacleMove() { this.beep(240, 0.02); }
      caught() {
        this.beep(330, 0.12, 'sawtooth');
        setTimeout(() => this.beep(220, 0.15, 'sawtooth'), 120);
        setTimeout(() => this.beep(146, 0.25, 'sawtooth'), 260);
      }
    }

    const audio = new GWBeepEngine();

    /* =====================================================================
       2. GAME ENGINE STATE & 1:1 OCTOPUS LOGIC
       ===================================================================== */
    const canvas = document.getElementById('gwCanvas');
    const ctx = canvas.getContext('2d');

    // UI Controls
    const soundToggle = document.getElementById('soundToggle');
    const soundLabel = document.getElementById('soundLabel');
    const aclBtn = document.getElementById('aclBtn');
    const btnGameA = document.getElementById('btnGameA');
    const btnGameB = document.getElementById('btnGameB');
    const btnTime = document.getElementById('btnTime');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const modeTag = document.getElementById('modeTag');
    const hiScoreVal = document.getElementById('hiScoreVal');
    const gameOverModal = document.getElementById('gameOverModal');
    const finalScoreVal = document.getElementById('finalScoreVal');
    const modalRestartBtn = document.getElementById('modalRestartBtn');

    // Modes & Scores
    let gameMode = 'A'; // 'A', 'B', 'TIME'
    let score = 0;
    let misses = 0; // max 3 misses
    let hiScore = parseInt(localStorage.getItem('gw_octopus_hi') || '0', 10);
    hiScoreVal.innerText = hiScore.toString().padStart(4, '0');

    // Diver state
    // 0 = Boat, 1 = Line/Top, 2 = Mid water, 3 = Low water, 4 = Chest grabbing
    let diverPos = 0;
    let goldBag = 0; // Number of coins currently carried (max bonus)
    let isCaught = false;
    let caughtCountdown = 0;
    let isGameOver = false;

    // Tentacle Segment LCD states (authentic discrete steps)
    // T1: Top-left tentacle (reaches Pos 1). maxStep = 3
    // T2: Mid-high tentacle (reaches Pos 2). maxStep = 4
    // T3: Mid-low tentacle (reaches Pos 3). maxStep = 4
    // T4: Bottom right tentacle (wraps chest / Pos 4). maxStep = 3
    const tentacles = [
      { step: 0, maxStep: 3, dangerSlot: 1, dir: 1, baseSpeed: 44, counter: 14 },
      { step: 0, maxStep: 4, dangerSlot: 2, dir: 1, baseSpeed: 36, counter: 28 },
      { step: 0, maxStep: 4, dangerSlot: 3, dir: 1, baseSpeed: 40, counter: 8  },
      { step: 0, maxStep: 3, dangerSlot: 4, dir: 1, baseSpeed: 30, counter: 20 }
    ];

    let frameTick = 0;

    function vibrate() {
      if (navigator.vibrate) {
        try { navigator.vibrate(25); } catch(e){}
      }
    }

    function resetGame(mode = 'A') {
      gameMode = mode;
      score = 0;
      misses = 0;
      diverPos = 0;
      goldBag = 0;
      isCaught = false;
      caughtCountdown = 0;
      isGameOver = false;
      frameTick = 0;

      tentacles.forEach((t, i) => {
        t.step = 0;
        t.dir = 1;
        t.counter = 10 + i * 12;
      });

      modeTag.innerText = `GAME ${gameMode}`;
      gameOverModal.classList.add('hidden');
    }

    function checkCollision() {
      if (isCaught || isGameOver) return;
      for (let t of tentacles) {
        if (t.step === t.maxStep && diverPos === t.dangerSlot) {
          triggerCaught();
          break;
        }
      }
    }

    function triggerCaught() {
      isCaught = true;
      caughtCountdown = 60; // flash duration
      goldBag = 0;
      misses++;
      audio.caught();
      vibrate();

      if (misses >= 3) {
        setTimeout(() => {
          isGameOver = true;
          finalScoreVal.innerText = score;
          if (score > hiScore) {
            hiScore = score;
            localStorage.setItem('gw_octopus_hi', hiScore.toString());
            hiScoreVal.innerText = hiScore.toString().padStart(4, '0');
          }
          gameOverModal.classList.remove('hidden');
        }, 1200);
      }
    }

    function moveRight() {
      audio.init();
      if (isGameOver || isCaught) return;
      vibrate();

      if (diverPos < 4) {
        diverPos++;
        audio.step();
        checkCollision();
      } else if (diverPos === 4) {
        // At the chest: scoop gold
        goldBag++;
        score += 1;
        if (score > hiScore) {
          hiScore = score;
          localStorage.setItem('gw_octopus_hi', hiScore.toString());
          hiScoreVal.innerText = hiScore.toString().padStart(4, '0');
        }
        audio.takeGold();
      }
    }

    function moveLeft() {
      audio.init();
      if (isGameOver || isCaught) return;
      vibrate();

      if (diverPos > 0) {
        diverPos--;
        audio.step();

        if (diverPos === 0) {
          // Safely returned to boat! Deposit gold bag for large bonus
          if (goldBag > 0) {
            score += goldBag * 3;
            goldBag = 0;
            if (score > hiScore) {
              hiScore = score;
              localStorage.setItem('gw_octopus_hi', hiScore.toString());
              hiScoreVal.innerText = hiScore.toString().padStart(4, '0');
            }
            audio.depositGold();
          }
        } else {
          checkCollision();
        }
      }
    }

    /* =====================================================================
       3. 1:1 AUTHENTIC SILK-SCREEN BACKGROUND & DISCRETE LCD SEGMENTS
       ===================================================================== */
    const LCD_INK = '#152012'; // Deep greenish-black liquid crystal segment color

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. SILK-SCREEN PRINTED COLOR OVERLAY (Exact 1981 Wide Screen Layer)
      drawAuthenticColorOverlay();

      // 2. FIXED LCD DISPLAY HUD (Clock / Score / Misses)
      drawDigitalHUD();

      // 3. SHIPWRECK & CHEST
      drawSunkenGalleon();

      // 4. RETRO OCTOPUS BODY & SUCTION PATTERN
      drawAuthenticOctopusHead();

      // 5. DISCRETE LCD TENTACLE SEGMENTS
      drawDiscreteTentacleSegments();

      // 6. RETRO DIVER SILHOUETTE & RESCUE BOAT
      drawDiverAndBoat();
    }

    // 1. Original silk-screen printed color backdrop:
    // Turquoise water tint across middle, dark seafloor, sunken red/brown ship, and boat
    function drawAuthenticColorOverlay() {
      // Light blue-turquoise water tint wash
      const waterGrad = ctx.createLinearGradient(0, 75, 0, 360);
      waterGrad.addColorStop(0, 'rgba(125, 204, 206, 0.35)');
      waterGrad.addColorStop(0.55, 'rgba(88, 182, 190, 0.45)');
      waterGrad.addColorStop(1, 'rgba(60, 145, 155, 0.28)');
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, 80, canvas.width, 290);

      // Sea waves prints (horizontal turquoise stylized wave bars)
      ctx.fillStyle = 'rgba(54, 155, 165, 0.40)';
      const waveBars = [
        [28, 96, 115], [168, 93, 135], [328, 96, 105],
        [58, 132, 95], [208, 128, 90],
        [38, 162, 125], [178, 164, 115],
        [68, 197, 100], [218, 200, 85]
      ];
      waveBars.forEach(([wx, wy, ww]) => {
        ctx.beginPath();
        ctx.roundRect(wx, wy, ww, 4, 2);
        ctx.fill();
      });

      // Dark seaweed & coral silhouettes along bottom
      ctx.fillStyle = 'rgba(34, 94, 68, 0.6)';
      ctx.beginPath();
      // Greenish sea floor bed
      ctx.moveTo(0, 420);
      ctx.lineTo(0, 385);
      ctx.quadraticCurveTo(80, 375, 160, 388);
      ctx.quadraticCurveTo(260, 400, 380, 388);
      ctx.lineTo(560, 390);
      ctx.lineTo(560, 420);
      ctx.closePath();
      ctx.fill();

      // Seaweeds
      drawSilkSeaweed(55, 382, '#1a6f4d');
      drawSilkSeaweed(135, 385, '#247f5a');
      drawSilkSeaweed(215, 394, '#1f7452');
    }

    function drawSilkSeaweed(x, y, col) {
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x - 9, y - 24, x - 2, y - 48);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x + 7, y);
      ctx.quadraticCurveTo(x + 16, y - 20, x + 8, y - 38);
      ctx.stroke();
      ctx.restore();
    }

    // 2. HUD (Digital 7-segment clock / score & Miss indicators)
    function drawDigitalHUD() {
      ctx.save();
      ctx.fillStyle = LCD_INK;

      // Top water dotted line
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = LCD_INK;
      ctx.setLineDash([7, 5]);
      ctx.beginPath();
      ctx.moveTo(15, 78);
      ctx.lineTo(545, 78);
      ctx.stroke();
      ctx.setLineDash([]);

      // Top Left: MISSES label & icons
      ctx.font = '10px "Share Tech Mono"';
      ctx.fillText('MISS', 35, 30);
      
      // Draw 3 Miss icons (Authentic Diver Mark V Helmet Caught silhouette)
      for (let i = 0; i < 3; i++) {
        const mx = 68 + i * 26;
        const my = 26;
        if (i < misses) {
          // Lit Mark V mini helmet indicator
          ctx.beginPath();
          ctx.arc(mx, my - 6, 5, 0, Math.PI * 2);
          ctx.fill();
          // Porch / Faceplate
          ctx.fillStyle = '#c9d7c0';
          ctx.beginPath();
          ctx.arc(mx + 2, my - 6, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = LCD_INK;
          ctx.fillRect(mx - 4, my - 1, 9, 8);
        } else {
          // Faint unlit ghost LCD segment
          ctx.strokeStyle = 'rgba(21, 32, 18, 0.12)';
          ctx.lineWidth = 1;
          ctx.strokeRect(mx - 4, my - 1, 9, 8);
          ctx.beginPath();
          ctx.arc(mx, my - 6, 5, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      // Top Right: Authentic LCD 7-Segment Score
      ctx.font = '38px "VT323", monospace';
      ctx.textAlign = 'right';
      const scoreStr = score.toString().padStart(4, '0');
      // Faint ghost '8888' backdrop
      ctx.fillStyle = 'rgba(21, 32, 18, 0.1)';
      ctx.fillText('8888', 525, 45);
      // Actual lit digits
      ctx.fillStyle = LCD_INK;
      ctx.fillText(scoreStr, 525, 45);

      // Gold in bag indicator under score
      ctx.font = '12px "Share Tech Mono"';
      ctx.fillText(`BAG: ${goldBag}`, 525, 62);

      ctx.restore();
    }

    // 3. Sunken 17th Century Pirate Galleon & Treasure Chest
    function drawSunkenGalleon() {
      ctx.save();

      // Silk printed reddish-brown shipwreck hull
      ctx.fillStyle = 'rgba(139, 58, 42, 0.65)';
      ctx.strokeStyle = LCD_INK;
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(430, 390);
      ctx.lineTo(545, 290);
      ctx.lineTo(550, 390);

        ctx.fillRect(x - 2, y - radius - 3, 4, 3);

    /* =====================================================================
       4. MAIN GAME TICK & SEGMENT TIMERS
       ===================================================================== */
    function updateEngine() {
      frameTick++;

      if (isCaught) {
        caughtCountdown--;
        if (caughtCountdown <= 0) {
          isCaught = false;
          diverPos = 0; // Respawn diver at boat deck
        }
        return;
      }

      if (isGameOver) return;

      // Speed increases with accumulated score and Game B mode
      const modeMultiplier = (gameMode === 'B') ? 0.75 : 1.0;
      const scoreRamp = Math.max(0.40, 1.0 - Math.min(score, 180) * 0.004);
      const totalSpeedFactor = modeMultiplier * scoreRamp;

      tentacles.forEach(t => {
        t.counter -= 1;
        if (t.counter <= 0) {
          t.counter = Math.round(t.baseSpeed * totalSpeedFactor) + Math.floor(Math.random() * 5);

          if (t.dir === 1) {
            t.step++;
            audio.tentacleMove();
            if (t.step >= t.maxStep) {
              t.step = t.maxStep;
              t.dir = -1; // Retract next
            }
          } else {
            t.step--;
            if (t.step <= 0) {
              t.step = 0;
              t.dir = 1; // Extend next
            }
          }

          checkCollision();
        }
      });
    }

    function animationLoop() {
      updateEngine();
      render();
      requestAnimationFrame(animationLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        moveLeft();
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === ' ') {
        moveRight();
      }
    });

    // Sound toggle
    soundToggle.addEventListener('click', () => {
      audio.enabled = !audio.enabled;
      soundLabel.innerText = audio.enabled ? '🔊 ON' : '🔇 OFF';
      vibrate();
    });

    // ACL / Clear / Reset button
    aclBtn.addEventListener('click', () => {
      resetGame(gameMode);
      vibrate();
    });

    // Mode Buttons
    btnGameA.addEventListener('click', () => {
      resetGame('A');
      audio.step();
      vibrate();
    });

    btnGameB.addEventListener('click', () => {
      resetGame('B');
      audio.step();
      vibrate();
    });

    btnTime.addEventListener('click', () => {
      // Toggle Time Display or reset
      audio.step();
      vibrate();
    });

    modalRestartBtn.addEventListener('click', () => {
      resetGame(gameMode);
    });

    window.onload = function () {
      resetGame('A');
      animationLoop();
    };
  </script>
</body>
</html>
